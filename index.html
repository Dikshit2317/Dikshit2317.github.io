<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkSmart</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: radial-gradient(circle at center, #0b1c24, #02060a);
    color: white;
}

header {
    display: flex;
    justify-content: space-between;
    padding: 20px 50px;
}

.logo {
    font-size: 26px;
    font-weight: 800;
}

.btn {
    padding: 10px 22px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    background: #00ffa6;
    color: black;
}

.center {
    text-align: center;
    margin-top: 80px;
}

.title {
    font-size: 80px;
    font-weight: 800;
}

.gradient {
    color: #00ffa6;
}

.subtitle {
    max-width: 700px;
    margin: 20px auto;
    color: #a0aab3;
}

/* Popup */
.popup {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: #0f1a22;
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    text-align: center;
}

.close {
    position: absolute;
    right: 15px;
    top: 10px;
    cursor: pointer;
}

.checkbox-group label {
    display: block;
    margin: 10px 0;
    text-align: left;
}
</style>
</head>

<body>

<header>
    <div class="logo">ParkSmart</div>
    <button class="btn" onclick="openAccessPopup()">Get Access →</button>
</header>

<div class="center">
    <div class="title">
        Smart Parking for <span class="gradient">Modern Facilities</span>
    </div>

    <div class="subtitle">
        Complete parking management system with analytics and automation.
    </div>

    <button class="btn" onclick="openAccessPopup()">Start</button>
</div>

<!-- Role Selection Popup -->
<div class="popup" id="accessPopup">
    <div class="popup-content">
        <span class="close" onclick="closeAccessPopup()">×</span>
        <h3>Select User Type</h3>

        <div class="checkbox-group">
            <label><input type="checkbox"> Valet</label>
            <label><input type="checkbox"> Staff</label>
            <label><input type="checkbox"> Admin</label>
        </div>

        <button class="btn" onclick="goToLogin()">Continue</button>
    </div>
</div>

<!-- Login Popup -->
<div class="popup" id="loginPopup">
    <div class="popup-content">
        <span class="close" onclick="closeLogin()">×</span>
        <h3>ID Login</h3>

        <input type="text" id="role" placeholder="Role" readonly><br><br>
        <input type="text" id="userId" placeholder="Enter ID"><br><br>

        <button class="btn" onclick="loginUser()">Login</button>

        <p id="loginMsg"></p>
    </div>
</div>

<script>

// Open/Close popups
function openAccessPopup() {
    document.getElementById('accessPopup').style.display = 'flex';
}

function closeAccessPopup() {
    document.getElementById('accessPopup').style.display = 'none';
}

function closeLogin() {
    document.getElementById('loginPopup').style.display = 'none';
}

// Move to login
function goToLogin() {
    let checkboxes = document.querySelectorAll('.checkbox-group input');
    let selected = "";

    checkboxes.forEach(cb => {
        if (cb.checked) {
            selected = cb.parentElement.innerText.trim();
        }
    });

    if (selected === "") {
        alert("Select a role first!");
        return;
    }

    document.getElementById('role').value = selected;

    closeAccessPopup();
    document.getElementById('loginPopup').style.display = 'flex';
}

// Fake database
const users = {
    Admin: ["admin123", "admin007"],
    Staff: ["staff123", "staff456"],
    Valet: ["valet111", "valet222"]
};

// Login check
function loginUser() {
    let role = document.getElementById('role').value;
    let id = document.getElementById('userId').value;

    if (users[role] && users[role].includes(id)) {
        document.getElementById('loginMsg').innerText = "✅ Login Successful";

        // Redirect example
        // window.location.href = "dashboard.php";

    } else {
        document.getElementById('loginMsg').innerText = "❌ Invalid ID";
    }
}

</script>

</body>
</html>
